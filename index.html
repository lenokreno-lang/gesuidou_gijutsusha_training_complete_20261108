function dailyQuestions(p){if(p.date===START)return conceptBank['下水道の全体像'].map((x,i)=>toQ(x,p,i));if(p.phase===5)return[];return genericQs.map((tpl,i)=>{let [sub,stem,opts]=tpl;let q={stem:stem.replaceAll('{t}',p.theme).replaceAll('{g}',p.goal),options:opts.map(x=>x.replaceAll('{t}',p.theme).replaceAll('{g}',p.goal)),answer:0,theme:p.theme,lv:p.lv};q.explanation=`正解は「${q.options[0]}」です。今日の到達目標は「${p.goal}」であり、テーマの目的と前後関係を押さえる選択肢が適切です。他の選択肢は、丸暗記、記録不足、安全軽視、または問題条件の無視につながります。実務では、${p.theme}を単独で見るのではなく、施設の役割、測定値、状態変化、安全手順を関連づけます。覚えるポイントは「目的→仕組み→確認→異常時の行動」の順に整理することです。`;return shuffleAnswer(q,p.date+i)})}
function toQ(x,p,i){return shuffleAnswer({stem:x[0],options:x[1],answer:x[2],explanation:x[3],theme:p.theme,lv:p.lv},p.date+i)}
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function shuffleAnswer(q,seed){let idx=q.options.map((_,i)=>i),n=hash(seed);for(let i=idx.length-1;i>0;i--){n=(n*1664525+1013904223)>>>0;let j=n%(i+1);[idx[i],idx[j]]=[idx[j],idx[i]]}let old=q.answer,opts=idx.map(i=>q.options[i]);return {...q,options:opts,answer:idx.indexOf(old),id:`${seed}-${hash(q.stem)}`}}

function renderPlan(){let q=$('#planSearch')?.value||'',k=$('#planKind')?.value||'',ph=$('#planPhase')?.value||'';let host=$('#planList');let arr=plans.filter(p=>(!q||(p.theme+p.goal).includes(q))&&(!k||p.kind===k)&&(!ph||String(p.phase)===ph));host.innerHTML=arr.map((p,i)=>`<details class="day ${p.date===studyDate()?'today':''} ${state.records[p.date]?.minutes>=10?'done':''}"><summary><div class="dayline"><b>${jpDate(p.date)}</b><span class="pill kind">${p.kind}</span><span class="pill lv">Lv${p.lv}</span><span>${p.theme}</span></div></summary><p><b>目安時間：</b>${p.time}</p><div class="goal"><b>到達目標</b><br>${p.goal}</div><p><b>出題方針：</b>${p.policy}</p><div class="actions"><button class="btn secondary" onclick="event.preventDefault();setStudyDate('${p.date}')">この日を開く</button></div></details>`).join('')||'<div class="empty">該当する日がありません</div>';['planSearch','planKind','planPhase'].forEach(id=>{let el=$('#'+id);el.oninput=renderPlan;el.onchange=renderPlan})}
function setStudyDate(d){state.settings.studyDate=d;save();showPage('home');toast(`${jpDate(d)}を表示しました`)}
function renderRecords(){let arr=Object.values(state.records).sort((a,b)=>a.date.localeCompare(b.date));$('#records').innerHTML=`<div class="card"><h2>学習記録</h2><form id="recForm" class="grid g2"><label class="field">日付<input type="date" id="rd" value="${studyDate()}" min="${START}" max="${END}"></label><label class="field">勉強時間（分）<input type="number" id="rm" min="0" value="45"></label><label class="field">問題数<input type="number" id="rq" min="0" value="10"></label><label class="field">正解数<input type="number" id="rs" min="0" value="0"></label><label class="field">理解度<select id="ru">${[1,2,3,4,5].map(x=>`<option ${x===3?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">メモ<textarea id="rmem" placeholder="理解できたこと、次に確認すること"></textarea></label><div class="actions"><button class="btn">保存</button><button type="button" class="btn secondary" onclick="exportCSV()">CSV出力</button><label class="btn secondary">CSV読込<input class="hidden" type="file" accept=".csv,text/csv" onchange="importCSV(this.files[0])"></label></div></form></div><div class="card tablewrap"><table class="table"><thead><tr><th>日付</th><th>時間</th><th>問題</th><th>正解</th><th>正答率</th><th>テーマ</th><th>Lv</th><th>理解度</th><th>メモ</th></tr></thead><tbody>${arr.map(r=>`<tr><td>${r.date}</td><td>${r.minutes}</td><td>${r.questions}</td><td>${r.score}</td><td>${r.questions?Math.round(r.score/r.questions*100):0}%</td><td>${r.theme}</td><td>${r.lv}</td><td>${r.understanding}</td><td>${r.memo||''}</td></tr>`).join('')}</tbody></table></div>`;$('#recForm').onsubmit=e=>{e.preventDefault();let d=$('#rd').value,p=getPlan(d),q=+$ ('#rq').value,s=+$ ('#rs').value;if(s>q){toast('正解数は問題数以下にしてください');return}state.records[d]={date:d,minutes:+$('#rm').value,questions:q,score:s,theme:p.theme,lv:p.lv,understanding:+$('#ru').value,memo:$('#rmem').value};save();renderRecords();toast('学習記録を保存しました')}}
function csvEsc(v){return '"'+String(v??'').replaceAll('"','""')+'"'}
function exportCSV(){let h=['日付','勉強時間','問題数','正解数','正答率','テーマ','難易度','理解度','メモ'],rows=Object.values(state.records).map(r=>[r.date,r.minutes,r.questions,r.score,r.questions?Math.round(r.score/r.questions*100):0,r.theme,r.lv,r.understanding,r.memo]);let csv='\ufeff'+[h,...rows].map(a=>a.map(csvEsc).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='下水道技術者検定_学習記録.csv';a.click();URL.revokeObjectURL(a.href)}
function parseCSV(s){let rows=[],row=[],cell='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function importCSV(f){if(!f)return;let rd=new FileReader();rd.onload=()=>{let rows=parseCSV(String(rd.result).replace(/^\ufeff/,''));for(let a of rows.slice(1)){if(!/^2026-/.test(a[0]))continue;let p=getPlan(a[0]);state.records[a[0]]={date:a[0],minutes:+a[1]||0,questions:+a[2]||0,score:+a[3]||0,theme:a[5]||p.theme,lv:+a[6]||p.lv,understanding:+a[7]||3,memo:a[8]||''}}save();renderRecords();toast('CSVを読み込みました')};rd.readAsText(f,'utf-8')}
function renderWeak(){let a=Object.values(state.wrong).sort((x,y)=>(y.count||0)-(x.count||0));$('#weak').innerHTML=`<div class="card"><h2>間違い・弱点</h2><p class="muted">誤答回数が多い順です。正解記号ではなく、なぜその選択肢になるかを言葉にしてください。</p>${a.length?a.map(q=>`<details class="day"><summary><div class="dayline"><span class="pill lv">誤答${q.count}回</span><b>${q.theme}</b></div><p>${q.stem}</p></summary><p><b>正解：</b>${'ABCD'[q.answer]}. ${q.options[q.answer]}</p><p>${q.explanation}</p></details>`).join(''):'<div class="empty">まだ間違いは記録されていません</div>'}</div>`}
function renderBank(id){let kind=id==='q3'?'第3種':'第2種',ps=plans.filter(p=>p.kind===kind),custom=state.custom.filter(q=>q.kind===kind);$('#'+id).innerHTML=`<div class="card"><h2>${kind}問題</h2><p>84日計画の現在位置に関係なく、分野別に10問練習できます。初学期間はホームの「今日の10問」を優先してください。</p><label class="field">分野<select id="bankSel">${ps.map((p,i)=>`<option value="${p.date}">${p.theme}（Lv${p.lv}）</option>`).join('')}</select></label><div class="actions"><button class="btn" onclick="startBank('${id}')">10問を始める</button></div></div><div class="card"><h3>ユーザー登録問題</h3><p>${custom.length}問登録済み</p><button class="btn secondary" onclick="showPage('settings')">問題を登録する</button></div>`}
function startBank(id){let d=$('#bankSel').value,p=getPlan(d);currentQuestions=dailyQuestions(p);currentMode='bank';answered={};showPage('quiz');renderQuiz(`${p.kind} 分野別：${p.theme}`)}
function renderReview(){let w=Object.values(state.wrong),qs=w.length?w.map(x=>({...x})):dailyQuestions(getPlan());$('#review').innerHTML=`<div class="grid g2"><div class="card"><h2>復習</h2><p>間違えた問題を優先して再出題します。現在の対象は${w.length}問です。</p><button class="btn" onclick="startReview()">復習を始める</button></div><div class="card"><h3>復習ルール</h3><ul><li>誤答直後は解説を読む</li><li>翌日、3日後、7日後を目安に再確認</li><li>正解しても説明できなければ弱点として残す</li></ul></div></div>`}
function startReview(){let w=Object.values(state.wrong);currentQuestions=(w.length?w:dailyQuestions(getPlan())).slice(0,10);currentMode='review';answered={};showPage('quiz');renderQuiz('間違い優先復習')}
function renderMock(){$('#mock').innerHTML=`<div class="grid g2"><div class="card"><h2>模試</h2><p>本番形式は計画日に合わせて使用してください。ここでは各テーマから問題を抽出します。</p><label class="field">種別<select id="mockKind"><option>第3種</option><option>第2種</option></select></label><label class="field">問題数<select id="mockCount"><option>10</option><option>20</option><option>30</option></select></label><button class="btn" onclick="startMock()">模試を始める</button></div><div class="card"><h3>指定日</h3><p><b>10/24：</b>第3種 本番形式</p><p><b>10/31：</b>第2種 本番形式</p><p><b>11/7：</b>最終確認。新しい問題は大量に解かない。</p></div></div>`}
function startMock(){let kind=$('#mockKind').value,n=+$('#mockCount').value,ps=plans.filter(p=>p.kind===kind),all=[];for(let p of ps)all.push(...dailyQuestions(p).slice(0,2));currentQuestions=all.sort((a,b)=>hash(a.id+'mock')-hash(b.id+'mock')).slice(0,n);currentMode='mock';answered={};showPage('quiz');renderQuiz(`${kind} 模試 ${n}問`)}
function renderSettings(){$('#settings').innerHTML=`<div class="grid g2"><div class="card"><h2>設定</h2><label class="field">表示する学習日<select id="dateMode"><option value="auto" ${state.settings.studyDate==='auto'?'selected':''}>今日を自動表示</option><option value="manual" ${state.settings.studyDate!=='auto'?'selected':''}>日付を指定</option></select></label><label class="field">指定日<input type="date" id="manualDate" min="${START}" max="${END}" value="${studyDate()}"></label><button class="btn" onclick="saveSettings()">設定を保存</button></div><div class="card"><h2>実際の過去問・自作問題を登録</h2><p class="muted">問題文の利用条件を確認し、ユーザー自身が登録した問題として保存します。</p><label class="field">種別<select id="ck"><option>第3種</option><option>第2種</option></select></label><label class="field">テーマ<input id="ct" placeholder="例：活性汚泥法"></label><label class="field">問題文<textarea id="cs"></textarea></label>${[0,1,2,3].map(i=>`<label class="field">選択肢${'ABCD'[i]}<input id="co${i}"></label>`).join('')}<label class="field">正解<select id="ca"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select></label><label class="field">解説<textarea id="ce"></textarea></label><button class="btn" onclick="addCustom()">登録</button></div><div class="card dangerzone"><h2>データ管理</h2><div class="actions"><button class="btn secondary" onclick="backupJSON()">全データをバックアップ</button><label class="btn secondary">復元<input class="hidden" type="file" accept=".json" onchange="restoreJSON(this.files[0])"></label><button class="btn bad" onclick="resetAll()">全データ削除</button></div></div></div>`}
function saveSettings(){state.settings.studyDate=$('#dateMode').value==='auto'?'auto':$('#manualDate').value;save();renderHome();toast('設定を保存しました')}
function addCustom(){let opts=[0,1,2,3].map(i=>$('#co'+i).value.trim()),stem=$('#cs').value.trim();if(!stem||opts.some(x=>!x)){toast('問題文と4つの選択肢を入力してください');return}state.custom.push({id:'custom-'+Date.now(),kind:$('#ck').value,theme:$('#ct').value||'ユーザー登録',stem,options:opts,answer:+$('#ca').value,explanation:$('#ce').value||'登録した解説はありません。',lv:6});save();toast('問題を登録しました');renderSettings()}
function backupJSON(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='下水道84日学習_バックアップ.json';a.click();URL.revokeObjectURL(a.href)}
function restoreJSON(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{state={...structuredClone(defaultState),...JSON.parse(r.result)};save();toast('データを復元しました');renderSettings()}catch(e){toast('JSONを読み込めませんでした')}};r.readAsText(f)}
function resetAll(){if(confirm('学習記録・間違い・登録問題をすべて削除しますか？')){localStorage.removeItem(KEY);state=structuredClone(defaultState);renderSettings();toast('全データを削除しました')}}
function runChecks(){let errors=[];if(plans.length!==84)errors.push('日数');if(plans[0].date!==START||plans.at(-1).date!==END)errors.push('日付範囲');if(plans.some(p=>!p.theme||!p.goal||!p.lv||!p.time))errors.push('計画項目');if(dailyQuestions(plans[0]).length!==10)errors.push('初日問題数');if(plans.slice(0,83).some(p=>dailyQuestions(p).length!==10))errors.push('毎日10問');console.info('84日サイト自己検査',errors.length?'要確認: '+errors.join(', '):'合格', {days:plans.length,first:plans[0],last:plans.at(-1)})}
initNav();renderHome();renderPlan();runChecks();
</script></body></html>
