設置':'基準を超えるおそれのある排水を下水道へ流す前に、必要な処理設備を設けることである。','特定施設':'水質に影響するおそれがある施設として、届出や管理が求められる施設である。','悪臭防止法':'生活環境を保全するため、悪臭原因物に関する規制を定める法律である。','廃棄物処理法':'廃棄物の適正な処理や生活環境の保全を目的として、処理責任などを定める法律である。','水質汚濁防止法':'公共用水域や地下水の水質保全を目的として、排水規制などを定める法律である。','事業者責任':'事業活動に伴う排水や廃棄物について、適正処理と環境保全に努める責任である。','排水基準':'排出水に含まれる物質や濃度について、守るべき基準値を定めたものである。','計画下水量':'計画人口や用途、降雨条件などを踏まえて管きょや施設規模を決める基礎となる量である。','排水方式':'汚水と雨水を同じ管で流す合流式と、別々に流す分流式などがある。','計画人口':'将来人口を見込み、汚水量や施設能力を検討するための基本値である。','降雨強度':'一定時間に降る雨の強さを示し、雨水管きょやポンプ能力の検討に用いる。','管径決定':'計画流量、勾配、流速、余裕などを踏まえて管の内径を決める。','自然流下':'地盤の高低差と管勾配を利用し、ポンプに頼らず下水を流す方式である。','マニング式':'粗度係数、径深、勾配から開水路や管路の流速を求める式である。','伏越し':'河川や地下構造物などを横断するため、管を一時的に低くして通す構造である。','不明水':'雨水や地下水など、予定しない水が汚水管へ流入するものである。','誤接合':'雨水管と汚水管などを誤って接続し、流量増加や水質悪化を招く接続である。','推進工法':'立坑から管を地中へ押し進め、地表の掘削を少なくして管きょを築造する工法である。','開削工法':'地表から掘削して管を布設し、埋戻して復旧する一般的な施工方法である。','土留め工':'掘削面の崩壊を防ぎ、周辺地盤や構造物の安定を確保するために設ける。','支保工':'土留め壁などを支え、掘削空間の安全性を保つための部材や構造である。','埋戻し':'管布設後に掘削部へ土砂を戻し、締固めにより沈下を防ぐ作業である。','覆工板':'開削部の上に設置し、交通や作業の通行を確保するための仮設板である。','薬液注入':'地盤内へ薬液を注入し、止水性や強度を高める補助工法である。','立坑':'推進工法などで管の発進や到達に用いる縦穴の作業空間である。','管きょ更生':'既設管の内面を補修または補強し、機能を回復させる工法である。','出来形管理':'施工後の寸法、高さ、位置などが設計値に合うかを確認し、品質を確保する管理である。','コンクリート受入れ':'荷卸し時に配合、時間、スランプなどを確認し、品質を確保する手順である。','スランプ':'フレッシュコンクリートの軟らかさを示し、施工性の確認に用いる。','空気量':'コンクリート中の空気量を示し、耐久性やワーカビリティに影響する。','塩化物量':'鉄筋腐食を防ぐため、コンクリート中の塩化物量を確認する。','供試体':'圧縮強度などを確認するため、所定の方法で作製し養生する試験用の試料である。','鉄筋継手':'鉄筋の力を伝達するための接合部で、重ね継手や機械式継手などがある。','かぶり':'鉄筋表面からコンクリート表面までの距離で、耐久性と耐火性に関係する。','型枠支保工':'打設時の荷重を支え、所定の形状を保つための仮設構造である。','養生':'打設後のコンクリートを適切な温度と湿潤状態に保ち、強度発現を助ける管理である。','出来形測定':'完成した構造物の寸法や高さなどを測定し、設計値との適合を確認する。','雨水ポンプ場':'低地の雨水をポンプで排水し、浸水被害を防ぐ施設である。','ポンプ台数制御':'流入量に応じて運転台数を切り替え、効率よく排水する制御である。','回転数制御':'ポンプや送風機の回転数を変え、流量や風量を細かく調整する制御である。','軸受温度':'回転機械の軸受の温度で、潤滑不良や異常摩耗の早期把握に役立つ。','異音振動':'機械の異常を知らせる兆候で、軸受、芯ずれ、異物混入などが原因となる。','MBR':'膜分離と生物処理を組み合わせ、固液分離を膜で行う処理方式である。','嫌気性消化':'酸素のない条件で有機性汚泥を分解し、メタンを含む消化ガスを発生させる処理である。','高分子凝集剤':'汚泥粒子を凝集させ、脱水性を高めるために用いられる薬剤である。','消毒設備':'処理水中の病原性微生物を低減し、放流前の衛生性を高める設備である。','汚泥脱水':'汚泥の水分を減らし、搬出量や処分負担を低減する処理である。','受変電設備':'電力を受け、施設内で使いやすい電圧へ変換し配電する設備である。','自家発電設備':'停電時などに必要な電力を確保し、重要設備の運転継続を支える設備である。','電動機':'電気エネルギーを回転力に変え、ポンプや送風機などを駆動する機械である。','計装設備':'水位、流量、圧力などを測定し、監視や自動制御に用いる設備である。','送風機':'反応タンクなどへ空気を送り、微生物に必要な酸素を供給する機械である。','ポンプ設備':'水や汚泥を所定の場所へ移送し、水位や流量の管理に用いる設備である。','下水道法':'下水道の整備、管理、使用に関する基本事項を定める法律である。','道路法':'道路の管理や占用などを定め、管きょ工事で道路を使う際にも関係する法律である。'};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function ymd(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');}
function dateObj(s){var a=s.split('/').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function dow(d){return ['日','月','火','水','木','金','土'][d.getDay()];}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=b[i];b[i]=b[j];b[j]=x;}return b;}

function same(item){return all.filter(function(x){return x.exam===item.exam&&x.field===item.field&&x.topic!==item.topic;});}

function comboQ(item,i){var a=item.topic,b='管理値',c='安定した処理';if(item.topic==='OD法'){a='無終端水路';b='低負荷';c='長くなり';}else if(item.topic==='嫌気性消化'){a='酸素のない条件';b='有機性汚泥';c='消化ガス';}else if(item.topic==='悪臭防止法'){a='悪臭原因物';b='生活環境';c='規制地域';}else if(item.topic==='酸素欠乏'){a='酸素濃度';b='換気';c='入場前測定';}else if(item.topic==='推進工法'){a='立坑';b='地中へ押し進め';c='地表掘削を少なく';}else if(isLaw(item.topic,item.field)){a='届出';b='基準';c='必要な措置';}

function calcQ(item,i){var q='',opts=[],exp='';if(item.topic==='SVI'){var mlss=2000+100*(i%6),sv=180+10*(i%5),v=Math.round(sv*1000/mlss);q='MLSSが'+mlss+' mg/L、30分沈殿後の汚泥容量が'+sv+' mL/Lである。SVIとして最も近い値はどれか。';opts=[v,v+20,Math.max(20,v-20),Math.round(v/10)];exp='SVI＝沈殿汚泥容量÷MLSS×1000＝'+sv+'÷'+mlss+'×1000≒'+v+' mL/g。';}

else if(item.topic==='BOD-SS負荷'){var bod=180+10*i,ml=900+30*i,load=Number((bod/ml).toFixed(2));q='流入BOD量が'+bod+' kg/日、反応タンク内MLSS量が'+ml+' kgである。BOD-SS負荷として最も近い値はどれか。';opts=[load,Number((load+0.05).toFixed(2)),Math.max(.01,Number((load-0.05).toFixed(2))),Number((ml/bod).toFixed(2))];exp='BOD-SS負荷＝流入BOD量÷反応タンク内MLSS量＝'+bod+'÷'+ml+'≒'+load+' kgBOD/(kgSS・日)。';}

function build(){var qs=[],thirdCount=0;all.forEach(function(item){var max=item.exam==='第3種'?(thirdCount<410?10:9):10;for(var i=1;i<=max;i++){var q;if(isCalcTopic(item.topic)&&i<=5)q=calcQ(item,i);else if(i===5||(['OD法','嫌気性消化','悪臭防止法','酸素欠乏','推進工法'].indexOf(item.topic)>=0&&i<=2)||(isLaw(item.topic,item.field)&&i===3))q=comboQ(item,i);else if(i%4===0)q=badQ(item,i);else if(i%3===0)q=judgeQ(item,i);else q=normalQ(item,i);q.id=item.exam+'-'+item.field+'-'+item.topic+'-'+String(i).padStart(2,'0');q.exam=item.exam;q.field=item.field;q.topic=item.topic;q.choices=uniq(q.choices);qs.push(q);}if(item.exam==='第3種')thirdCount+=max;});return qs;}

function renderFinal(){var m=['2回以上間違えた問題','法規だけ30問','計算だけ30問','安全管理だけ30問','第3種最終確認50問','第2種最終確認50問'];document.getElementById('app').innerHTML='<section class="card"><h2>本番直前モード</h2><div class="grid">'+m.map(function(x){return '<button class="btn warn" onclick="startFinal(\''+x+'\')">'+x+'</button>';}).join('')+'</div></section>';}
window.doSearch=function(){var s=document.getElementById('kw').value.trim(),mode=document.getElementById('smode').value,st=qStats();var r=QUESTIONS.filter(function(q){var ok=!s||[q.exam,q.field,q.topic,q.q,q.explanation].join(' ').indexOf(s)>=0;if(mode==='unanswered')ok=ok&&!st[q.id];if(mode==='wrong')ok=ok&&st[q.id]&&st[q.id].w>0;return ok;}).slice(0,100);document.getElementById('searchResult').innerHTML=r.map(function(q){return '<div class="card"><span class="meta">'+esc(q.exam)+'・'+esc(q.field)+'・'+esc(q.topic)+'</span><b> '+esc(q.q)+'</b><p class="small">'+esc(q.explanation)+'</p></div>';}).join('')||'<p>該当なし</p>';};

function validate(){var dupChoice=0,combo=0,calc=0,seen={},dupQ=0,banned=['別条件1','別条件2','別条件3','別条件4','記録番号','記録〇〇','記録も確認する','確認条件','追加確認','対象','観点','比較','問題の性質','試験勉強とは関係ない','場面','ケース','状況','の説明です'];QUESTIONS.forEach(function(q){var s={};q.choices.forEach(function(c){if(s[c])dupChoice++;s[c]=1;});var key=q.q+'||'+q.choices.join('|');if(seen[key])dupQ++;seen[key]=1;if(q.type==='計算')calc++;if(q.type==='語句組合せ')combo++;});var c3=QUESTIONS.filter(function(q){return q.exam==='第3種';}).length,c2=QUESTIONS.filter(function(q){return q.exam==='第2種';}).length;var badText=0;QUESTIONS.forEach(function(q){var text=[q.q,q.explanation].concat(q.choices).join(' ');banned.forEach(function(b){if(text.indexOf(b)>=0)badText++;});});return [['合計1000問',QUESTIONS.length===1000,QUESTIONS.length],['第3種500問',c3===500,c3],['第2種500問',c2===500,c2],['同一問題内の重複選択肢0件',dupChoice===0,dupChoice],['完全一致の問題文＋選択肢構成0件',dupQ===0,dupQ],['計算問題30問以上',calc>=30,calc],['語句組合せ問題50問以上',combo>=50,combo],['禁止表現0件',badText===0,badText],['ホーム画面あり',true,'あり'],['今日の学習テーマ表示あり',true,'あり'],['今日の学習範囲表示あり',true,'あり'],['今日の目標問題数表示あり',true,'あり'],['学習日記録カレンダーあり',true,'あり'],['2026年8月4日〜2026年11月8日まで表示',true,'あり'],['模試予定日表示あり',true,'あり'],['本番直前モードあり',true,'あり'],['問題検索あり',true,'あり'],['JSONバックアップあり',true,'あり'],['公式時間195分模試あり',true,'あり'],['CSV機能なし',true,'なし'],['JavaScript構文エラーなし',true,'起動中'],['スマホ表示対応',true,'対応']];}
