function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let x=seed>>>0;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296}}
function shuffle(a,seed){const r=rng(seed);const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const todayKey=()=>new Date().toISOString().slice(0,10);
function getTopic(exam,name){return TOPICS.find(t=>t.exam===exam&&t.name===name)}
function adjacent(t){return TOPICS.filter(x=>x.exam===t.exam&&x.name!==t.name).sort((a,b)=>hash(t.name+a.name)-hash(t.name+b.name)).slice(0,5)}
function baseChoices(t,field,answer){const pool=adjacent(t);const vals=pool.map(x=>({text:x[field],topic:x.name})).filter(x=>x.text&&x.text!==answer);return [answer,...vals.slice(0,3).map(x=>x.text)]}
function mk(id,exam,t,stem,answer,explain,kind='四肢択一',choices=null,calc=null){let cs=choices||baseChoices(t,'definition',answer);cs=shuffle(cs,hash(id));let ans=cs.indexOf(answer);return {id,exam,field:t.field,topic:t.name,stem,choices:cs,answer:ans,explain,kind,calc}}
function genStandard(t,i){
 const facts=[['定義',`「${t.name}」の説明として、最も適切なものはどれか。`,t.definition,`「${t.name}」は${t.definition}。定義を押さえると、近接する${t.near}との区別がしやすい。`],['目的',`「${t.name}」の主な目的として、最も適切なものはどれか。`,t.purpose,`目的は「${t.purpose}」である。${t.confuse}ため、単なる測定・設備名として暗記しない。`],['原理',`「${t.name}」の原理・仕組みに関する記述として、最も適切なものはどれか。`,t.principle,`原理は${t.principle}。この関係が崩れる条件を確認すると、異常時の判断にもつながる。`],['理由',`運転・施工管理で「${t.name}」を確認する理由として、最も適切なものはどれか。`,t.reason,`確認する理由は${t.reason}。測定値だけでなく、関連する${t.near}も併せて判断する。`],['正常',`「${t.name}」が適正な状態にある場合の特徴として、最も適切なものはどれか。`,t.normal,`正常時は${t.normal}。この状態から外れた場合は${t.abnormal}ことを疑い、${t.response}。`],['異常',`「${t.name}」に異常が生じた場合の説明として、最も適切なものはどれか。`,t.abnormal,`異常時には${t.abnormal}。原因を一つに決めつけず、${t.response}ことが基本である。`],['対応',`「${t.name}」の異常を確認したときの対応として、最も適切なものはどれか。`,t.response,`対応として${t.response}。${t.reason}ため、関連設備・水質も確認する。`],['設備',`「${t.name}」と関係が深い設備として、最も適切なものはどれか。`,t.equipment,`関連設備は${t.equipment}。設備の状態だけでなく、${t.name}の値や現象との因果関係を確認する。`],['水質',`「${t.name}」と直接関係する水質・管理項目として、最も適切なものはどれか。`,t.water,`関連項目は${t.water}。${t.confuse}ため、指標の意味を区別して扱う。`],['法規',`「${t.name}」に関連して確認すべき法令・基準として、最も適切なものはどれか。`,t.law,`関連法令は${t.law}。具体的な基準値や期限は、受験時点の法令・条例で確認する必要がある。`]];
 const f=facts[i%facts.length];
 let ans=f[2], pool=[];
 if(f[0]==='設備') pool=adjacent(t).map(x=>x.equipment); else if(f[0]==='水質') pool=adjacent(t).map(x=>x.water); else if(f[0]==='法規') pool=adjacent(t).map(x=>x.law); else pool=adjacent(t).map(x=>x[f[0]==='定義'?'definition':f[0]==='目的'?'purpose':f[0]==='原理'?'principle':f[0]==='理由'?'reason':f[0]==='正常'?'normal':f[0]==='異常'?'abnormal':'response']);
 pool=[...new Set(pool)].filter(x=>x&&x!==ans); const choices=[ans,...pool.slice(0,3)];

}

 const exams=p.exam==='mix'?['3','2']:[p.exam]; let qs=[]; exams.forEach(e=>{const pools=p.t.pools&&p.t.pools.length?p.t.pools:[]; pools.forEach(name=>{qs.push(...(e==='3'?Q3:Q2).filter(q=>q.topic===name))});});
 if(!qs.length){qs=(p.exam==='3'?Q3:Q2)} return shuffle(qs,hash(p.date+p.topic)).slice(0,10)
}

{ id:'beginner-1',topic:'下水道の全体像',kind:'四肢択一',stem:'下水道の基本的な役割として最も適切なものはどれか。',choices:['汚水や雨水を排除・処理し、生活環境や公共用水域を守る','飲料水だけを製造する','河川の水位だけを管理する','道路の舗装だけを行う'],answer:0,explain:'下水道は汚水・雨水の排除や処理を通じて、生活環境の改善と公共用水域の水質保全に役立つ。'},

function renderPlan(){const rows=STUDY_PLAN.map((x,i)=>{const [date,stage,exam,topic,content,goal,minutes]=x;const today=date===dateInfo().date;return `<tr${today?' style="font-weight:800;background:#eef7ff"':''}><td>${i+1}</td><td>${date}${today?' ★':''}</td><td>${exam==='mix'?'2・3':exam}種</td><td>${stage}</td><td><b>${topic}</b><br>${content}</td><td>${goal}</td><td>${minutes}分</td></tr>`}).join('');document.getElementById('plan').innerHTML=`<div class="card"><h2>8/17〜11/8 学習計画</h2><p>下水道知識ほぼゼロからの新入社員向けに、基礎→3種基礎→2種・3種実戦→仕上げの順で進みます。★が今日の内容です。</p><div style="overflow:auto"><table><thead><tr><th>#</th><th>日付</th><th>試験</th><th>段階</th><th>学習内容</th><th>到達目標</th><th>目安</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function renderHome(){const p=dailyPlan(),date=p.date;const hist=Object.values(state.dailyAnswers||{});const answered=hist.reduce((a,x)=>a+(x.answers?Object.keys(x.answers).length:0),0);const correct=hist.reduce((a,x)=>a+(x.correct||0),0);const rate=answered?Math.round(correct/answered*100):0;document.getElementById('home').innerHTML=`<div class="card"><h2>今日の学習</h2><div class="small">${date}｜${p.exam==='mix'?'2・3':p.exam}種｜第${p.week}週｜${p.stage}</div><h3>${p.topic}</h3><p>${p.content}</p><div class="badges"><span class="badge g">目標${p.target}分</span><span class="badge">今日の10問</span></div><p class="small"><b>今日の到達目標：</b>${p.goal}</p><div class="actions"><button class="btn" onclick="go('study')">今日の問題を解く</button><button class="btn secondary" onclick="go('results')">学習結果を見る</button></div></div><div class="card"><h3>⏱ 朝45分の進め方</h3><p>5分：前日の復習 → 20分：今日の内容 → 15分：問題演習 → 5分：間違い・疑問をノート</p><p class="small">45分できない日は20分・10分へ短縮OK。0分にしないことを優先します。</p></div><div class="grid"><div class="stat"><b>${answered}</b><span>累計回答数</span></div><div class="stat"><b>${correct}</b><span>累計正答数</span></div><div class="stat"><b>${rate}%</b><span>累計正答率</span></div><div class="stat"><b>${VALIDATION.length===0?'OK':'要確認'}</b><span>内部検証</span></div></div><div class="card"><h3>今日のチェック</h3><label class="checkline"><input id="planCheck" type="checkbox" ${state.planCheckDate===date?'checked':''} onchange="state.planCheckDate=this.checked?'${date}':'';save();"> 今日の指定範囲を勉強した</label><p class="small">新入社員・初学者向けに、最初は「理解→問題→説明」の順で進めます。</p></div><div class="card"><h3>11/8までの4段階</h3><p>🌱 8/17〜8/30：基礎導入 → 📚 8/31〜9/27：3種基礎完成 → 🔥 9/28〜10/18：2種・3種実戦 → 🏆 10/19〜11/7：仕上げ</p></div><div class="notice">問題は参考サイトの傾向を踏まえた<strong>オリジナル生成問題</strong>です。公開過去問の文章をそのまま大量転載するものではありません。法令・基準値・試験日程等は受験時点の公式情報で最終確認してください。</div>`}
function go(page){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(page).classList.remove('hidden');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));state.activePage=page;render(page)}
function render(page){if(page==='home')renderHome();if(page==='study')renderStudy();if(page==='mock')renderMock();if(page==='results')renderResults();if(page==='plan')renderPlan();if(page==='topics')renderTopics()}
function renderStudy(){const qs=dailyQuestions();state.daily=qs;const date=dailyPlan().date;const saved=state.dailyAnswers[date];document.getElementById('study').innerHTML=`<div class="card"><h2>今日の10問</h2><div class="small">${dailyPlan().exam==='mix'?'2・3':dailyPlan().exam}種｜${dailyPlan().topic}｜目標${dailyPlan().target}分</div><p class="small"><b>学習内容：</b>${dailyPlan().content}</p><p class="small"><b>到達目標：</b>${dailyPlan().goal}</p><div class="progress"><i style="width:${saved?100:0}%"></i></div><div id="dailyStats" class="small">未回答：${saved?Object.keys(saved.answers).length:0}/10</div></div><div id="dailyQs"></div><div class="actions"><button class="btn" id="dailySubmit" onclick="submitDaily()">採点する</button></div>`;renderQs('dailyQs',qs,saved?saved.answers:{},!!saved)}
function renderQs(container,qs,answers,submitted){document.getElementById(container).innerHTML=qs.map((q,i)=>{const chosen=answers[q.id];return `<div class="q"><div class="qhead"><span class="qnum">問${i+1}</span><span class="badge">${q.topic}</span><span class="badge">${q.kind}</span></div><div class="question">${q.stem.replace(/\n/g,'<br>')}</div>${q.choices.map((c,j)=>{let cls='';if(submitted){if(j===q.answer)cls='correct';if(chosen===j&&j!==q.answer)cls='wrong'}return `<label class="choice ${cls}"><input type="radio" name="${q.id}" value="${j}" ${chosen===j?'checked':''} ${submitted?'disabled':''} onchange="recordAnswer('${q.id}',${j})"><span>${String.fromCharCode(65+j)}. ${c}</span></label>`}).join('')}${submitted?`<div class="result ${chosen===q.answer?'ok':'ng'}">${chosen===q.answer?'正解':'不正解'}｜正解：${String.fromCharCode(65+q.answer)}</div><div class="explain">${q.explain.replace(/\n/g,'<br>')}</div>`:''}</div>`}).join('')}
function recordAnswer(id,v){if(!state.tempAnswers)state.tempAnswers={};state.tempAnswers[id]=v;const n=Object.keys(state.tempAnswers).length;const el=document.getElementById('dailyStats');if(el)el.textContent=`未回答：${10-n}/10`}
function submitDaily(){const date=dailyPlan().date;const answers=state.tempAnswers||{};const existing=state.dailyAnswers[date];if(existing)return;let correct=0;state.daily.forEach(q=>{if(answers[q.id]===q.answer)correct++});state.dailyAnswers[date]={answers,correct,total:state.daily.length,submittedAt:new Date().toISOString()};state.tempAnswers={};save();renderStudy()}
function renderMock(){document.getElementById('mock').innerHTML=`<div class="card"><h2>本番形式ミニ模試</h2><p class="small">20問・2種/3種を選択。模試結果は分野別正答率まで保存します。</p><div class="tabs"><button class="tab sel" onclick="startMock('3')">3種20問</button><button class="tab" onclick="startMock('2')">2種20問</button></div><div class="actions"><button class="btn" onclick="startMock('3')">3種模試を開始</button><button class="btn secondary" onclick="startMock('2')">2種模試を開始</button></div><div id="mockArea"></div></div>`}
function startMock(exam){const pool=exam==='3'?Q3:Q2;state.mock=shuffle(pool,hash('mock'+exam+new Date().toISOString().slice(0,10))).slice(0,20);state.mockExam=exam;state.mockAnswers={};state.mockSubmitted=false;renderMockArea()}
function renderMockArea(){const area=document.getElementById('mockArea');if(!state.mock){return}area.innerHTML=`<h3>${state.mockExam}種 模試</h3><div class="small">未回答：20/20</div><div id="mockQs"></div><div class="actions"><button class="btn" onclick="submitMock()">採点する</button></div>`;renderQs('mockQs',state.mock,state.mockAnswers,false)}
function submitMock(){if(state.mockSubmitted)return;let correct=0;const by={};state.mock.forEach(q=>{const c=state.mockAnswers[q.id]===q.answer;if(c)correct++;by[q.field]??={c:0,n:0};by[q.field].n++;if(c)by[q.field].c++});state.mockSubmitted=true;const rec={date:new Date().toISOString(),exam:state.mockExam,correct,total:state.mock.length,by};state.mockHistory??=[];state.mockHistory.push(rec);save();document.getElementById('mockArea').innerHTML=`<h3>${state.mockExam}種 模試結果</h3><div class="grid"><div class="stat"><b>${correct}/${state.mock.length}</b><span>正答数</span></div><div class="stat"><b>${Math.round(correct/state.mock.length*100)}%</b><span>正答率</span></div></div><table><tr><th>分野</th><th>正答率</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${Math.round(v.c/v.n*100)}%</td></tr>`).join('')}</table><div class="actions"><button class="btn secondary" onclick="startMock('${state.mockExam}')">もう一度</button></div>`}
function renderResults(){const hist=Object.values(state.dailyAnswers||{});let n=0,c=0;hist.forEach(x=>{n+=x.total||0;c+=x.correct||0});const errs={};const recent=[];hist.sort((a,b)=>new Date(a.submittedAt)-new Date(b.submittedAt)).forEach(x=>{if(x.answers)Object.entries(x.answers).forEach(([id,v])=>{const q=[...Q3,...Q2].find(z=>z.id===id);if(q){recent.push({q,v});if(v!==q.answer){errs[q.topic]??={wrong:0,total:0};errs[q.topic].wrong++;errs[q.topic].total++}else{errs[q.topic]??={wrong:0,total:0};errs[q.topic].total++}}})});const last=recent.slice(-100),lr=last.length?Math.round(last.filter(x=>x.v===x.q.answer).length/last.length*100):0;document.getElementById('results').innerHTML=`<div class="card"><h2>学習結果</h2><div class="grid"><div class="stat"><b>${n}</b><span>回答数</span></div><div class="stat"><b>${c}</b><span>正答数</span></div><div class="stat"><b>${n?Math.round(c/n*100):0}%</b><span>累計正答率</span></div><div class="stat"><b>${lr}%</b><span>直近100問</span></div></div></div><div class="card"><h3>苦手論点</h3><table><tr><th>論点</th><th>誤答</th><th>正答率</th></tr>${Object.entries(errs).sort((a,b)=>b[1].wrong-a[1].wrong).slice(0,15).map(([k,v])=>`<tr><td>${k}</td><td>${v.wrong}</td><td>${Math.round((v.total-v.wrong)/v.total*100)}%</td></tr>`).join('')}</table></div><div class="card"><h3>模試履歴</h3>${(state.mockHistory||[]).slice().reverse().map(x=>`<p>${new Date(x.date).toLocaleString('ja-JP')}｜${x.exam}種｜${x.correct}/${x.total}（${Math.round(x.correct/x.total*100)}%）</p>`).join('')||'<p class="small">まだありません。</p>'}</div><div class="card"><h3>誤答履歴</h3><p class="small">同一問題を2回以上間違えた履歴は、今後の反復出題の基礎としてローカル保存されます。</p></div>`}
function renderTopics(){document.getElementById('topics').innerHTML=`<div class="card"><h2>論点データ</h2><div class="tabs"><button class="tab sel" onclick="topicList('3')">3種</button><button class="tab" onclick="topicList('2')">2種</button></div><div id="topicList"></div></div>`;topicList('3')}
function topicList(exam){const ts=TOPICS.filter(t=>t.exam===exam);document.getElementById('topicList').innerHTML=ts.map(t=>`<details class="card"><summary><strong>${t.name}</strong>｜${t.field}</summary><p><b>定義：</b>${t.definition}</p><p><b>目的：</b>${t.purpose}</p><p><b>原理：</b>${t.principle}</p><p><b>確認理由：</b>${t.reason}</p><p><b>正常：</b>${t.normal}</p><p><b>異常：</b>${t.abnormal}</p><p><b>対応：</b>${t.response}</p><p><b>設備：</b>${t.equipment}</p><p><b>水質：</b>${t.water}</p><p><b>法令：</b>${t.law}</p><p><b>混同：</b>${t.confuse}</p><p><b>近接：</b>${t.near}</p><p><b>式：</b>${t.formula}</p><p><b>単位：</b>${t.unit}</p><p><b>典型ミス：</b>${t.mistake}</p></details>`).join('')}
load();document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render('home');
</script></body></html>
