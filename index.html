は、後段設備の摩耗や閉塞を防ぐため、し渣や砂を除去する。","沈砂池では、溶解性有機物を微生物の作用によって除去する。","沈砂池は物理的にし渣・砂を除去する。"],["反応タンクでは、活性汚泥と下水を混合し、微生物の作用で有機物を除去する。","反応タンクでは、消毒剤だけですべての有機物を沈殿除去する。","反応タンクは生物処理施設である。"],["最終沈殿池では、反応タンク流出水から活性汚泥を沈降分離する。","最終沈殿池では、流入下水中の砂だけを高速撹拌して除去する。","最終沈殿池は活性汚泥と処理水を分離する。"]],"quality":[["BODは、好気性微生物が有機物を分解するときに消費する酸素量を表す。","BODは、水中の浮遊物質の質量だけを表す。","BODは生物化学的酸素要求量である。"],["CODは、酸化剤で被酸化性物質を酸化するときの酸素相当量を表す。","CODは、水中の溶存酸素濃度そのものを表す。","CODは化学的酸素要求量である。"],["SSは、水中に懸濁している物質の量を表す。","SSは、水中の溶存酸素量を表す。","SSは浮遊物質である。"],["DOは、水中に溶けている酸素の量を表す。","DOは、反応タンク混合液中の浮遊物質濃度を表す。","DOは溶存酸素である。"]],"activated":[["返送汚泥は、最終沈殿池で沈降した汚泥の一部を反応タンクへ戻すものである。","返送汚泥は、処理水のBODを高めるため放流渠へ加える。","返送により反応タンク内の活性汚泥量を維持する。"],["余剰汚泥は、処理系内で増加した汚泥を系外へ引き抜くものである。","余剰汚泥は、最終沈殿池の上澄水を消毒槽へ送る水である。","増殖分を汚泥処理系へ送る。"],["MLSSは、反応タンク混合液中の浮遊物質濃度を表す。","MLSSは、最終沈殿池の水面積負荷だけを表す。","MLSSは活性汚泥量の代表的指標である。"],["バルキングでは、汚泥の沈降性が悪化し、処理水へ流出するおそれがある。","バルキングでは、汚泥の沈降性が必ず改善し、SVIは低下する。","バルキング時は沈降性が悪化する。"]],"indices":[["HRTは、対象槽の有効容量を流入流量で除して求める。","HRTは、流入流量を対象槽容量で除して求める汚泥濃度である。","HRTの基本は容量÷流量である。"],["SRTは、活性汚泥が処理系内に平均的に滞留する時間を表す。","SRTは、処理水の瞬間流速だけを表す。","SRTは固形物の滞留時間である。"],["F/M比は、微生物量に対する流入有機物負荷の比である。","F/M比は、返送汚泥量を処理水量で除した消毒率である。","FはFood、MはMicroorganismsである。"],["余剰汚泥引抜量を増やすと、他条件が同じならSRTは短くなる。","余剰汚泥引抜量を増やすと、他条件が同じでもSRTは必ず長くなる。","系外へ出る固形物が増えるとSRTは短くなる。"]],"advanced":[["硝化は、好気条件でアンモニア性窒素を亜硝酸・硝酸性窒素へ酸化する反応である。","硝化は、無酸素条件で硝酸性窒素を窒素ガスへ還元する反応である。","後者は脱窒である。"],["脱窒は、無酸素条件で硝酸・亜硝酸性窒素を窒素ガスへ還元する反応である。","脱窒は、好気条件でアンモニア性窒素を硝酸性窒素へ酸化する反応である。","後者は硝化である。"],["生物学的リン除去では、リンを取り込んだ汚泥を系外へ排出する。","生物学的リン除去では、処理水を全量返送すればリンが消滅する。","リンを汚泥として系外へ除去する。"],["窒素・リンの過剰流入は、閉鎖性水域などの富栄養化に関係する。","窒素・リンは富栄養化と関係せず、多いほど常に望ましい。","栄養塩の過剰流入は富栄養化の一因である。"]],"sludge":[["汚泥濃縮は、固形物濃度を高め、後段へ送る汚泥体積を減少させる。","汚泥濃縮は、水を加えて汚泥体積を増やすことだけを目的とする。","濃縮は後段負荷を軽減する。"],["嫌気性消化では、有機物の安定化・減量化とともに消化ガスが発生する。","嫌気性消化では、常に大量の空気を供給して好気条件を維持する。","嫌気性消化は酸素を供給しない条件で行う。"],["汚泥脱水は、汚泥中の水分を分離して搬出・処分量を減らす。","汚泥脱水は、処理水中のDOを増加させるためだけの工程である。","脱水は汚泥を減容する。"],["高分子凝集剤は、微細な汚泥粒子を凝集させ、脱水性を改善する。","高分子凝集剤は、脱水ケーキを完全に水へ溶解させる。","フロック形成により固液分離を助ける。"]],"safety":[["マンホールや槽内作業では、作業前および作業中の酸素・有害ガス測定と換気が重要である。","短時間のマンホール作業では、酸素・有害ガス測定や換気を省略してよい。","酸欠等は見た目や時間だけでは判断できない。"],["硫化水素は有毒であり、下水道施設で発生・滞留するおそれがある。","硫化水素は無害であるため濃度測定や換気は不要である。","硫化水素には中毒等の危険がある。"],["回転機械の点検時は、動力源を遮断し、起動禁止措置を行う。","回転機械を運転したまま保護カバー内へ手を入れる。","停止・隔離・再起動防止が基本である。"],["酸欠場所で倒れた人の救助では、保護具なしで単独進入してはならない。","酸欠場所では測定や呼吸用保護具なしで直ちに単独救助する。","二次災害防止が必要である。"]],"hydraulics":[["流量Qは、平均流速Vと流水断面積Aの積Q=VAで表される。","流量Qは、平均流速Vを流水断面積Aで除したQ=V/Aで表される。","連続の基本関係はQ=VAである。"],["管きょの勾配や粗度は、流速・流量に影響する。","管きょの勾配や粗度は、流速・流量に全く影響しない。","マニング式にも勾配・粗度が含まれる。"],["流速が小さすぎる管きょでは、固形物が堆積しやすくなる。","流速が小さいほど、固形物は必ず堆積しにくくなる。","適切な流速確保が必要である。"],["全揚程は、実揚程に管路の損失水頭などを加えて考える。","全揚程は、管路損失を無視して実揚程だけと常に等しい。","摩擦・局部損失を考慮する。"]],"construction":[["開削工法は、地表面から掘削して管きょを布設する工法である。","開削工法は、地表面を掘削せず発進立坑から管を押し進める工法である。","後者は推進工法である。"],["推進工法は、発進立坑から管を地中へ押し進めて布設する非開削工法である。","推進工法は、道路全幅を連続開削する工法だけをいう。","推進は非開削工法である。"],["埋戻し・締固めは、管きょ周辺の支持と道路等の沈下防止に配慮して行う。","埋戻し土は締固めず、将来の沈下を促進させることが望ましい。","材料・層厚・締固め管理が重要である。"],["コンクリート打込み後は、所要の強度と耐久性を得るため適切に養生する。","コンクリートは打込み直後から急速に乾燥させるほど品質が向上する。","初期乾燥等を抑える養生が必要である。"]]},KEYS=["flow","flow","flow","flow","flow","flow","flow","flow","hydraulics","flow","flow","activated","activated","flow","quality","quality","quality","quality","quality","flow","sludge","activated","sludge","sludge","quality","indices","indices","indices","flow","advanced","advanced","advanced","advanced","sludge","sludge","sludge","sludge","safety","safety","hydraulics","flow","safety","activated","sludge","safety","flow","flow","hydraulics","hydraulics","hydraulics","hydraulics","construction","construction","hydraulics","hydraulics","hydraulics","activated","sludge","sludge","advanced","quality","safety","flow","flow","safety","indices","activated","hydraulics","flow","flow","safety","quality","indices","activated","flow","flow","flow","quality","sludge","sludge","indices","flow","flow","flow"];const LK='sewer84_honban';let S=JSON.parse(localStorage.getItem(LK)||'{}');S.records=S.records||{};S.wrong=S.w ').forEach((b,j)=>b.onclick=()=>{ans[i]=j;c.querySelectorAll('.opt').forEach((x,k)=>x.classList.toggle('sel',k===j))}))}function rq(){let d=dy();Q=make(d);A=Array(10).fill(null);qh.innerHTML='<h1>'+d.date+'の10問</h1><div class="card">'+d.exam+'｜'+e(d.theme)+'｜Lv'+d.lv+'<p>過去問の出題形式・論点を参考にしたオリジナル問題です。「適当」「適当でない」に注意してください。</p></div>';render('ql',Q,A)}function mark(id,qs,ans){let s=0;document.querySelectorAll('#'+id+' .qi').forEach((c,i)=>{c.querySelectorAll('.opt').forEach((b,j)=>{if(j===qs[i].an)b.classList.add('ok');if(ans[i]===j&&j!==qs[i].an)b.classList.add('ng')});if(ans[i]===qs[i].an)s++;else if(!S.wrong.includes(qs[i].id))S.wrong.push(qs[i].id);c.querySelector('.exp').classList.add('show')});sv();return s}function score(){let d=dy(),s=mark('ql',Q,A);S.records[d.date]=Object.assign(S.records[d.date]||{},{date:d.date,min:(S.records[d.date]||{}).min||0,total:10,correct:s,theme:d.theme});sv();alert('採点結果 '+s+'/10')}function rp(){pl.innerHTML=P.map((d,i)=>'<div class="card '+(d.date===D?'today':'')+'">Day'+(i+1)+'｜'+d.date+'｜'+d.exam+'｜Lv'+d.lv+'<h3>'+e(d.theme)+'</h3><p>'+e(d.goal)+'<br>'+d.time+'</p><button class="btn" onclick="D=\''+d.date+'\';S.day=D;sv();home();pg(\'home\')">開く</button></div>').join('')}function rr(){rd.value=rd.value||D;let r=S.records[rd.value]||{};rm.value=r.min||'';rn.value=r.memo||'';ru.value=r.understand||3;rl.innerHTML=Object.values(S.records).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>'<div class="card">'+r.date+'｜'+(r.min||0)+'分｜'+(r.correct||0)+'/'+(r.total||0)+'｜'+e(r.theme)+'<br>'+e(r.memo)+'</div>').join('')}function saveRec(){let d=rd.value,r=S.records[d]||{date:d,total:0,correct:0,theme:(P.find(x=>x.date===d)||{}).theme};r.min=+rm.value||0;r.memo=rn.value;r.understand=+ru.value;S.records[d]=r;sv();rr()}function rw(){let m=new Map(P.flatMap(make).map(q=>[q.id,q]));wl.innerHTML=S.wrong.map(id=>m.get(id)).filter(Boolean).map(q=>'<details class="card"><summary>'+e(q.theme)+'｜'+e(q.text)+'</summary><p>正解：'+e(q.opts[q.an])+'</p><p>'+e(q.exp)+'</p><button onclick="S.wrong=S.wrong.filter(x=>x!==\''+q.id+'\');sv();rw()">理解済み</button></details>').join('')||'<div class="card">弱点はありません。</div>'}function mock(ex){let pool=P.filter(d=>d.exam===ex).flatMap(make);MQ=sh(pool,Date.now()%9999).slice(0,20);MA=Array(20).fill(null);render('ml',MQ,MA);ml.insertAdjacentHTML('beforeend','<button class="btn" id="mb">採点</button>');mb.onclick=()=>alert('模試 '+mark('ml',MQ,MA)+'/20')}home();</script></body></html>
