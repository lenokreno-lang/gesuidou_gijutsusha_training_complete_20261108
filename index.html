<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>下水道技術者検定 毎日トレーニング</title><style>:root{--b:#f5f7fb;--c:#fff;--t:#0f172a;--m:#2563eb;--l:#d7e3f3;--ok:#16a34a;--ng:#dc2626;--w:#f59e0b}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.65}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#173b7a,#2563eb);color:#fff;padding:15px}h1{font-size:20px;margin:0}.ver{font-size:12px}.wrap{max-width:1180px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--l)}.tabs button{white-space:nowrap;border:1px solid var(--l);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700}.tabs button.active{background:var(--m);color:#fff}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.kpi{background:#eef4ff;border-radius:14px;padding:12px}.kpi b{font-size:22px}.btn{border:0;border-radius:12px;background:var(--m);color:#fff;padding:11px 14px;font-weight:800;margin:4px}.sub{background:#334155}.ok{background:var(--ok)}.warn{background:var(--w);color:#111827}.badge,.pill{display:inline-block;background:#eef2f7;border-radius:999px;padding:5px 9px;margin:3px;font-size:12px}.today{background:#dbeafe}.meta{font-size:12px;background:#f1f5f9;border-radius:999px;padding:5px 10px;display:inline-block}.question{font-size:18px;font-weight:900;margin:8px 0}.choice{display:block;width:100%;text-align:left;border:1px solid #cbd5e1;background:#fff;border-radius:13px;padding:12px 14px;margin:10px 0;font-weight:700}.sel{border-color:var(--m);background:#eff6ff}.correct{border-color:var(--ok);background:#dcfce7}.wrong{border-color:var(--ng);background:#fee2e2}.explain{background:#f8fafc;border-left:4px solid var(--m);padding:10px}.tablewrap{overflow-x:auto}.cal{border-collapse:collapse;min-width:900px;width:100%}.cal th,.cal td{border:1px solid var(--l);padding:7px;font-size:12px}.cal th{background:#eaf1ff}.done{background:#fff7ed}.ach{background:#dcfce7}.todayrow{outline:3px solid #2563eb}.input{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px}.small{font-size:12px;color:#64748b}.good{color:var(--ok);font-weight:900}.bad{color:var(--ng);font-weight:900}@media(max-width:640px){h1{font-size:17px}.wrap{padding:10px}.card{padding:13px}.question{font-size:16px}.choice{font-size:14px}.btn{width:100%;margin:5px 0}}</style></head><body><header><h1>下水道技術者検定 毎日トレーニング</h1><div class="ver">完全版 v1.9 2026-08-04 選択肢品質改訂版</div></header><nav id="nav" class="tabs"></nav><main id="app" class="wrap"></main><script>(function(){'use strict';var KEY='gesuidou_v19_quality_revised',S={tab:'home',session:[],answers:{},scored:false,title:'',last:null},tabs=[['home','ホーム'],['quiz','今日の問題'],['result','学習結果'],['calendar','学習日記録'],['mock','模試'],['final','本番直前'],['search','問題検索'],['backup','記録保全'],['validate','検証']],letters=['A','B','C','D'],E={"第3種":{"下水処理":["BOD","COD","SS","DO","MLSS","SVI","硝化","脱窒","最終沈殿池","OD法","活性汚泥法"],"工場排水":["高BOD排水","油分","六価クロム","シアン","pH","除害施設","凝集沈殿","重金属排水","水質測定","よう素消費量"],"運転管理":["返送汚泥","余剰汚泥","BOD-SS負荷","HRT","SRT","バルキング","汚泥界面","DO管理","返流水","処理水SS"],"安全管理":["酸素欠乏","硫化水素","可燃性ガス","塩素ガス","停電作業","検電","換気","保護具","マンホール作業","薬品取扱い"],"法規":["下水道法の用語","公共下水道使用料","水質測定記録","除害施設設置","特定施設","悪臭防止法","廃棄物処理法","水質汚濁防止法","事業者責任","排水基準"]},"第2種":{"管きょの設計":["計画下水量","排水方式","計画人口","降雨強度","管径決定","自然流下","マニング式","伏越し","不明水","誤接合"],"管きょの施工":["推進工法","開削工法","土留め工","支保工","埋戻し","覆工板","薬液注入","立坑","管きょ更生","出来形管理"],"施工管理":["コンクリート受入れ","スランプ","空気量","塩化物量","供試体","鉄筋継手","かぶり","型枠支保工","養生","出来形測定"],"下水処理・汚泥処理":["雨水ポンプ場","ポンプ台数制御","回転数制御","軸受温度","異音振動","MBR","嫌気性消化","高分子凝集剤","消毒設備","汚泥脱水"],"電気・機械・法規":["受変電設備","自家発電設備","電動機","計装設備","送風機","ポンプ設備","下水道法","水質汚濁防止法","悪臭防止法","道路法"]}},D={"BOD":"微生物が有機物を分解するときに消費する酸素量を示し、有機物負荷の把握に用いられる。","COD":"酸化剤で酸化される物質量を酸素量に換算し、水中の汚濁の程度を把握する指標となる。","SS":"水中に浮遊している固形物量を示し、沈殿やろ過による固液分離の良否を判断する指標となる。","DO":"水中に溶けている酸素量を示し、反応タンクの好気状態を判断する指標となる。","MLSS":"反応タンク内の活性汚泥濃度を示し、返送汚泥量や余剰汚泥量の調整に用いられる。","SVI":"活性汚泥の沈降性を表す指標であり、値が大きいほど沈みにくい傾向を示す。","硝化":"アンモニア性窒素を亜硝酸性窒素や硝酸性窒素へ酸化する好気性の反応である。","脱窒":"硝酸性窒素などを窒素ガスへ還元する反応であり、無酸素条件と有機物が関係する。","最終沈殿池":"活性汚泥と処理水を沈降分離し、清澄な上澄水を得るために設けられる。","OD法":"無終端水路を反応タンクとし、低負荷で比較的長いSRTを確保しやすい方式である。","活性汚泥法":"微生物を含む活性汚泥により有機物を分解し、沈殿分離と返送を組み合わせる。","高BOD排水":"有機物濃度が高く、処理施設の酸素要求量や汚泥発生量を増加させやすい。","油分":"管きょへの付着や閉塞、生物処理の阻害を招くおそれがあるため、流入前の分離が重要となる。","六価クロム":"毒性が強く、還元して三価クロムとした後に水酸化物として沈殿除去する方法が用いられる。","シアン":"毒性が高く、適切なpH管理のもとで酸化分解などにより無害化を図る。","pH":"水素イオン濃度の程度を表し、酸性またはアルカリ性の強さを判断する指標となる。","除害施設":"下水道へ流す前に、有害物質や高濃度の汚濁物質を低減するために設ける。","凝集沈殿":"凝集剤で微細粒子をフロック化し、沈降分離しやすくする処理である。","重金属排水":"中和による水酸化物生成や凝集沈殿などを組み合わせて処理することが多い。","水質測定":"排水や処理水の性状を把握し、処理の安定性や基準への適合を確認するために行う。","よう素消費量":"排水中の還元性物質による消毒剤の消費程度を把握する指標として用いられる。","返送汚泥":"最終沈殿池で沈降した汚泥を反応タンクへ戻し、必要な微生物量を維持する。","余剰汚泥":"増殖した汚泥の一部を系外へ引き抜き、MLSSやSRTを適正に保つ。","BOD-SS負荷":"流入BOD量を反応タンク内のMLSS量で除して、活性汚泥への有機物負荷を表す。","HRT":"水が槽内に平均して滞留する時間であり、槽容量を流量で除して求める。","SRT":"汚泥が処理系内に平均して滞留する日数であり、硝化や汚泥発生量に関係する。","バルキング":"活性汚泥の沈降性が悪化し、最終沈殿池で固液分離が不良となる現象である。","汚泥界面":"沈殿池内の汚泥層と上澄水の境界であり、汚泥引抜きや返送の管理に用いる。","DO管理":"反応タンク内の溶存酸素を適正に保ち、処理性能と送風電力を調整する。","返流水":"濃縮や脱水などから処理系へ戻る水であり、窒素やSSの負荷を増加させることがある。","処理水SS":"処理水中の浮遊物質量であり、沈殿池の状態や汚泥流出の有無を判断する。","酸素欠乏":"作業前に酸素濃度を測定し、換気と監視体制を整えてから入る必要がある。","硫化水素":"低所や汚水の滞留部で発生しやすく、毒性と腐食性をもつため濃度測定が必要となる。","可燃性ガス":"爆発のおそれがあるため、火気を排除し、作業前と作業中に濃度を確認する。","塩素ガス":"刺激性と毒性が強く、漏えい時は風向を考慮して退避し、適切な保護具を用いる。","停電作業":"電源を遮断し、誤投入防止措置を行い、検電によって無電圧を確認する。","検電":"電路が無電圧であることを検電器で確認し、感電災害を防止する。","換気":"酸素濃度を回復させ、有害ガスを排出して閉鎖空間の安全を確保する。","保護具":"作業の危険性と有害物質の性状に応じて選定し、正しく装着して使用する。","マンホール作業":"酸欠や有害ガスの危険があるため、測定、換気、監視、救出体制を整える。","薬品取扱い":"安全データシートを確認し、混触や飛散を避け、必要な保護具と洗浄設備を備える。","下水道法の用語":"公共下水道や流域下水道などの用語を定め、施設と管理の基本を整理している。","公共下水道使用料":"下水道の使用に応じて徴収され、施設の維持管理などの財源となる。","水質測定記録":"測定年月日、測定箇所、測定結果などを整理し、所定の方法で保存する。","除害施設設置":"基準に適合しないおそれのある排水を下水道へ流す前に、必要な処理設備を設ける。","特定施設":"水質に影響を及ぼすおそれがある施設として、届出や適正な管理が求められる。","悪臭防止法":"生活環境を保全するため、規制地域における悪臭原因物の排出などを規制する。","廃棄物処理法":"廃棄物の排出抑制と適正処理を通じて、生活環境の保全を図る。","水質汚濁防止法":"公共用水域や地下水の水質を保全するため、排出水の規制などを定める。","事業者責任":"事業活動に伴う排水や廃棄物について、適正処理と環境保全に努める。","排水基準":"排出水に含まれる物質の濃度などについて、遵守すべき限度を定める。","計画下水量":"計画人口、用途別使用水量、地下水量、降雨条件などを踏まえて設定する。","排水方式":"汚水と雨水を同一管で流す合流式と、別の管で流す分流式に大別される。","計画人口":"将来人口を推計し、計画汚水量や施設能力を検討する基礎値とする。","降雨強度":"一定時間当たりの降雨の強さを表し、雨水流出量の算定に用いる。","管径決定":"計画流量、勾配、流速、維持管理性、余裕などを考慮して内径を定める。","自然流下":"地盤の高低差と管勾配を利用し、重力によって下水を流す方式である。","マニング式":"粗度係数、径深、動水勾配から開水路や管路の平均流速を求める。","伏越し":"河川や地下構造物を横断するため、管路を一時的に低下させて通す構造である。","不明水":"地下水や雨水など、計画上想定していない水が汚水管へ流入するものである。","誤接合":"雨水管と汚水管などを誤って接続し、流量増加や水質悪化を招く接続である。","推進工法":"発進立坑から管を地中へ押し進め、地表の掘削を抑えて管きょを築造する。","開削工法":"地表から掘削して管を布設し、埋戻しと路面復旧を行う施工方法である。","土留め工":"掘削面の崩壊を防ぎ、周辺地盤や構造物の安定を確保するために設ける。","支保工":"土留め壁などを内側から支え、掘削空間の安全性を確保する仮設構造である。","埋戻し":"管布設後に掘削部へ土砂を戻し、所定の厚さごとに締め固めて沈下を防ぐ。","覆工板":"開削部の上に設置し、車両や歩行者の通行を確保するための仮設部材である。","薬液注入":"地盤へ薬液を注入し、止水性や強度を高める補助工法である。","立坑":"推進工法などで管の発進、到達、資機材の搬出入に用いる縦穴である。","管きょ更生":"既設管の内面を補修または補強し、非開削で機能を回復させる工法である。","出来形管理":"施工後の寸法、高さ、位置などを測定し、設計値への適合を確認する。","コンクリート受入れ":"荷卸し時に納入書、運搬時間、スランプ、空気量などを確認する。","スランプ":"フレッシュコンクリートの軟らかさを表し、施工性の確認に用いる。","空気量":"コンクリート中の空気の割合であり、耐久性やワーカビリティに影響する。","塩化物量":"鉄筋腐食の抑制を目的として、フレッシュコンクリート中の量を確認する。","供試体":"圧縮強度などを確認するため、所定の方法で採取、作製、養生する試料である。","鉄筋継手":"鉄筋の応力を伝達する接合部であり、重ね継手や機械式継手などがある。","かぶり":"鉄筋表面からコンクリート表面までの距離で、耐久性や耐火性に関係する。","型枠支保工":"打込み時の荷重を支え、コンクリートを所定の形状に保つ仮設構造である。","養生":"打込み後のコンクリートを適切な温度と湿潤状態に保ち、強度発現を促す。","出来形測定":"完成した構造物の寸法や高さなどを測定し、設計値との適合を確認する。","雨水ポンプ場":"低地の雨水をポンプで排水し、浸水被害を防止するための施設である。","ポンプ台数制御":"流入量や水位に応じて運転台数を切り替え、効率的に排水する。","回転数制御":"ポンプや送風機の回転数を変化させ、流量や風量を連続的に調整する。","軸受温度":"潤滑不良や異常摩耗を早期に把握するため、回転機械で継続的に監視する。","異音振動":"軸受損傷、芯ずれ、異物混入などの異常を把握する手掛かりとなる。","MBR":"生物処理と膜分離を組み合わせ、固液分離を膜で行う処理方式である。","嫌気性消化":"酸素のない条件で有機性汚泥を分解し、メタンを含む消化ガスを発生させる。","高分子凝集剤":"汚泥粒子をフロック化し、脱水機における固液分離性を高める。","消毒設備":"処理水中の病原性微生物を低減し、放流前の衛生性を確保する。","汚泥脱水":"汚泥の水分を減らし、搬出量や処分量を低減するために行う。","受変電設備":"電力を受け、施設内で使用する電圧へ変換して各負荷へ配電する。","自家発電設備":"停電時に必要な電力を供給し、重要設備の運転継続を支える。","電動機":"電気エネルギーを回転力へ変換し、ポンプや送風機などを駆動する。","計装設備":"水位、流量、圧力などを測定し、監視や自動制御に利用する。","送風機":"反応タンクへ空気を送り、微生物に必要な酸素を供給する。","ポンプ設備":"水や汚泥を所定の位置へ移送し、水位や流量を管理する。","下水道法":"下水道の整備、管理、使用などに関する基本事項を定める。","道路法":"道路の管理や占用などを定め、道路内で管きょ工事を行う際にも関係する。"},ALL=[];Object.keys(E).forEach(function(ex){Object.keys(E[ex]).forEach(function(f){E[ex][f].forEach(function(t){ALL.push({exam:ex,field:f,topic:t})})})});function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function sh(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=b[i];b[i]=b[j];b[j]=x}return b}function y(d){return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}function dt(s){var a=s.split('/').map(Number);return new Date(a[0],a[1]-1,a[2])}function store(){try{var s=JSON.parse(localStorage.getItem(KEY)||'{}')||{};s.history=s.history||[];s.checks=s.checks||{};s.mock=s.mock||[];return s}catch(e){return{history:[],checks:{},mock:[]}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function same(o){return ALL.filter(function(x){return x.exam===o.exam&&x.field===o.field&&x.topic!==o.topic})}function falseText(o){var m={'SVI':'SVIは値が大きいほど活性汚泥の沈降性が良好であることを示す。','硝化':'硝化は硝酸性窒素を窒素ガスへ還元する無酸素反応である。','脱窒':'脱窒はアンモニア性窒素を硝酸性窒素へ酸化する好気反応である。','酸素欠乏':'酸素欠乏のおそれがある場所では、短時間の作業なら濃度測定を省略できる。','検電':'停電作業では、開閉器の表示を確認すれば検電を行わなくてよい。','養生':'コンクリートの養生は、打込み直後から乾燥を促進することを目的とする。','マニング式':'マニング式は、コンクリートの圧縮強度を求めるために用いる。'};return m[o.topic]||o.topic+'は、運転管理や品質確保に影響しないため、確認や調整を行う必要がない。'}function uniq(a){return new Set(a).size===a.length}function make(o,i){var pool=sh(same(o)),q,z,opts,type='通常',exp;if(['SVI','HRT','SRT','BOD-SS負荷','返送汚泥','マニング式'].indexOf(o.topic)>=0&&i<=5)return calc(o,i);if((['OD法','嫌気性消化','悪臭防止法','酸素欠乏','推進工法'].indexOf
